name: Test and dependency security

on:
  pull_request:
    branches: ['3.0', '3.4']
  push:
    branches: ['3.4']
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  unit:
    name: Unit (node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --strict-peer-deps
      - run: npm run test:run
      - run: node --test .github/scripts/*.test.cjs

  security-build:
    name: Dependency audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --strict-peer-deps
      - run: npm run audit
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run docs:validate
      - run: npm run build:lib
      - run: npm run test:types
      - run: npm run build:docs

  visual:
    name: Visual (browser, blit 계약)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --strict-peer-deps
      - name: Install Playwright chromium
        run: npx --no -- playwright install --with-deps chromium
      # Compare blit and full redraw within the same browser execution.
      # Committed Chart.visual.spec.js images are macOS-specific.
      - name: Run blit equivalence visual tests
        run: npx --no -- vitest run --config vitest.config.browser.js chart.blit chart.realtime

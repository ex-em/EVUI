name: Issue Remove Inactive

on:
  issues:
    types: [edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

jobs:
  inactive-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'ex-em/EVUI'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event.issue.state == 'open' && !github.event.issue.pull_request && github.actor == github.event.issue.user.login
        with:
          script: |
            const manageInactive = require('./.github/scripts/inactive-issues.cjs');
            await manageInactive({ github, context, mode: 'remove' });

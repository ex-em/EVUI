name: Validate API Docs

on:
  pull_request:
    branches: [3.0, 3.4]
    paths:
      - "docs/views/apiDocs/data/**"
      - "scripts/validate-api-docs.js"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Use Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate API docs schema
        run: node scripts/validate-api-docs.js

name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '릴리즈 브랜치 선택'
        required: true
        default: '3.4'
        type: choice
        options:
          - '3.4'
      dry-run:
        description: 'Dry-run 모드 (실제 배포 없이 테스트)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.branch }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Build
        run: npm run build:lib

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$RELEASE_DRY_RUN" = 'true' ]; then
            npx --no -- semantic-release --dry-run
          else
            npx --no -- semantic-release
          fi

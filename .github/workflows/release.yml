name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '릴리즈 브랜치 선택'
        required: true
        default: '3.4'
        type: choice
        options:
          - '3.4'
      dry-run:
        description: 'Dry-run 모드 (실제 배포 없이 테스트)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:lib

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release ${{ inputs.dry-run && '--dry-run' || '' }}

      - name: Create version bump PR
        if: ${{ !inputs.dry-run }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(release): update package.json and CHANGELOG.md'
          title: 'chore(release): version bump'
          branch: release/version-bump
          delete-branch: true
          base: '3.4'
          add-paths: |
            package.json
            CHANGELOG.md
